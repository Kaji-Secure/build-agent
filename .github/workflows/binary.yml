name: Publish the agent binary

# The host role runs on a machine, not in a container: the same Nuitka-compiled agent as a file (amd64 for now), with its checksum,
# on the GitHub release of the tag. The units and settings for systemd and OpenRC are in dist/, and an ebuild in dist/gentoo/. dist/install.sh is attached too:
# it downloads the binary, sets the service up and enrolls the host (the console's Add host shows the command).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # setuptools-scm reads the version from the tags
      - name: Build (Nuitka compiles the agent, so this takes a few minutes)
        # The build stage of the image's Dockerfile has the binary at /out/kaji-agent: take it out of there, so the file and the image are one build.
        run: |
          scm="$(pip install -q setuptools-scm && python -m setuptools_scm)"; echo "agent version: $scm"
          docker build --target build --build-arg VERSION="$scm" -t kaji-agent-build .
          docker create --name out kaji-agent-build
          mkdir dist-out
          docker cp out:/out/kaji-agent "dist-out/kaji-agent-linux-${{ matrix.arch }}"
          (cd dist-out && sha256sum "kaji-agent-linux-${{ matrix.arch }}" > "kaji-agent-linux-${{ matrix.arch }}.sha256")
      - name: It starts
        run: |
          chmod +x "dist-out/kaji-agent-linux-${{ matrix.arch }}"
          "dist-out/kaji-agent-linux-${{ matrix.arch }}" --help
          KAJI_TOKEN= "dist-out/kaji-agent-linux-${{ matrix.arch }}" --role host 2>&1 | grep -q "a token is needed"
      - uses: actions/upload-artifact@v4
        with:
          name: kaji-agent-linux-${{ matrix.arch }}
          path: dist-out/*
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist-out/* dist/install.sh --clobber  # install.sh: what the console's "Add host" shows the user to run
