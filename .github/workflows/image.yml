name: Publish the agent image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Each architecture is built natively on a runner of its own (Nuitka does not cross-compile) and pushed under its own tag; the manifest job joins them.
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # setuptools-scm reads the version from the tags
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build (Nuitka compiles the agent, so this takes a few minutes)
        # The tag v1.2.3 makes the image 1.2.3, the version the chart of the same tag defaults to; a manual run publishes only "dev".
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kaji-agent"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=dev; fi
          scm="$(pip install -q setuptools-scm && python -m setuptools_scm)"; echo "agent version: $scm"
          docker build --build-arg VERSION="$scm" -t "$image:$version-${{ matrix.arch }}" .
      - name: Push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kaji-agent"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=dev; fi
          docker push "$image:$version-${{ matrix.arch }}"

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: One multi-arch tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kaji-agent"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; tags="$version latest"; else version=dev; tags=dev; fi
          for tag in $tags; do
            docker buildx imagetools create -t "$image:$tag" "$image:$version-amd64" "$image:$version-arm64"
          done
          docker buildx imagetools inspect "$image:$version"
