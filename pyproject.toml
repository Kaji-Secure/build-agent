[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kaji-agent"
dynamic = ["version"]  # from the git tag by setuptools-scm: v1.2.3 is 1.2.3, a commit after it 1.2.4.dev3+g<commit>
description = "The kaji builder agent: runs on your own nodes and does the build work kaji sends it"
requires-python = ">=3.10"
dependencies = ["websockets>=13"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
kaji-agent = "kaji_agent.__main__:main"

[tool.setuptools_scm]
version_file = "src/kaji_agent/_version.py"  # what the agent reports in its hello (kaji_agent/version.py); not committed
fallback_version = "0.0.0+unknown"  # a source tree with no git (an archive, a Docker context without .git): the build passes VERSION instead

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
