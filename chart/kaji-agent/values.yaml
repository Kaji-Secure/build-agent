# Where the agent connects to, and what it proves itself with. Make a builder in the console (Organization -> Builders) and keep its token.
url: wss://console.kaji.systems/agent/ws
token: ""            # the builder's token (kb_...): put into a Secret by this chart
existingSecret: ""   # or the name of a Secret that has it under the key "token"; then token is not used

image:
  repository: ghcr.io/kaji-secure/kaji-agent
  tag: ""  # empty: the chart's appVersion, which is the version of the image published with it
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The agent makes the Jobs of its tasks in its own namespace (the release's). The Job's CPUs, memory and architecture come from the task.
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
nodeSelector: {}
tolerations: []

# The CPU CORES (not threads: with hyper-threading, 16 cores are 32 CPUs) this agent gives kaji to build with. Teams may give 16 in all, over all
# its agents together; an agent that would go past that is refused and fails. Empty: the container's CPU limit (resources.limits.cpu, which is in
# CPUs, so it is divided by the threads per core), and without one the biggest node of the cluster.
cpus: ""

# What this agent does: builder (runs your builds; the only role built so far), host or cluster. It must be what its token was made for in the
# console (Organization > Agents), or the gateway refuses it.
role: builder

# The agent also tells the console what the cluster is: its Kubernetes version, the operating system of each node and the images that run in it (the console's
# Clusters page). It needs to list pods of all namespaces (read-only: the RBAC adds it). false: no such report, and the RBAC has no pods rule.
clusterReport: true

# The agent also scans the images that run in the cluster for known vulnerabilities (the console's Clusters page): a short Trivy Job per image, in the release's namespace,
# that downloads Trivy's database and the image, and whose findings (not the image) the agent sends to the console. It needs the cluster report (clusterReport) and
# outgoing HTTPS to the image's registry and to ghcr.io (Trivy's database). An image that needs credentials is shown as not scanned. enabled: false never starts a Job.
imageScan:
  enabled: true
  # Where Trivy comes from, for an organization that keeps it in its own repositories. Each one left empty is the public one.
  image: ""         # the Trivy image the Jobs run; empty: ghcr.io/aquasecurity/trivy (the version this agent was tested with). The namespace needs a pull secret for it (see below). For example registry.corp.example/security/trivy:0.58.1
  dbRepository: ""  # Trivy's vulnerability database as an OCI repository; empty: ghcr.io/aquasecurity/trivy-db:2. For example registry.corp.example/security/trivy-db:2
