# Where the agent connects to, and what it proves itself with. Make a builder in the console (Organization -> Builders) and keep its token.
url: wss://console.kaji.systems/agent/ws
token: ""            # the builder's token (kb_...): put into a Secret by this chart
existingSecret: ""   # or the name of a Secret that has it under the key "token"; then token is not used

image:
  repository: registry.shift-computing.de/oz123/kaji-agent
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The agent makes the Jobs of its tasks in its own namespace (the release's). The Job's CPUs, memory and architecture come from the task.
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
nodeSelector: {}
tolerations: []

# The CPU CORES (not threads: with hyper-threading, 16 cores are 32 CPUs) this agent gives kaji to build with. Teams may give 16 in all, over all
# its agents together; an agent that would go past that is refused and fails. Empty: the container's CPU limit (resources.limits.cpu, which is in
# CPUs, so it is divided by the threads per core), and without one the biggest node of the cluster.
cpus: ""
