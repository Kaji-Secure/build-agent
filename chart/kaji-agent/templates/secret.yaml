{{- if not .Values.existingSecret }}
{{- if not .Values.token }}{{ fail "set token (the builder's token) or existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata: {name: {{ include "kaji-agent.secret" . }}, namespace: {{ .Release.Namespace }}}
stringData: {token: {{ .Values.token | quote }}}
{{- end }}
