apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
---
# The agent makes Jobs (and the ConfigMap and Secrets each needs) in its own namespace, and reads their pods for the result and the log: nothing else there. The one thing it may read beyond its namespace is the list of nodes (below).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "create"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
subjects: [{kind: ServiceAccount, name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}]
roleRef: {kind: Role, name: {{ .Release.Name }}, apiGroup: rbac.authorization.k8s.io}
---
# Read the nodes, only to tell the console which architectures and sizes this cluster can run, so that a task is not given to a builder it cannot fit.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ .Release.Namespace }}-{{ .Release.Name }}-nodes}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ .Release.Namespace }}-{{ .Release.Name }}-nodes}
subjects: [{kind: ServiceAccount, name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}]
roleRef: {kind: ClusterRole, name: {{ .Release.Namespace }}-{{ .Release.Name }}-nodes, apiGroup: rbac.authorization.k8s.io}
