apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
spec:
  replicas: 1   # one agent per builder: a second one with the same token would be given the same tasks
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: KAJI_URL, value: {{ .Values.url | quote }}}
            - {name: KAJI_TOKEN, valueFrom: {secretKeyRef: {name: {{ include "kaji-agent.secret" . }}, key: token}}}
            - {name: KAJI_ROLE, value: {{ .Values.role | default "builder" | quote }}}
            {{- if .Values.cpus }}
            - {name: KAJI_CPUS, value: {{ .Values.cpus | quote }}}
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
